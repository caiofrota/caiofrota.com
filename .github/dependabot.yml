version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    # Routine version updates are handled deliberately. Dependabot alerts and
    # repository triage rules own automated security maintenance.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: "scope"
