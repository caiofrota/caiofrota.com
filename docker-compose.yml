services:
  postgres:
    image: postgres:16-alpine
    container_name: caiofrota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caiofrota
      POSTGRES_USER: caiofrota
      POSTGRES_PASSWORD: caiofrota
    ports:
      - "${POSTGRES_PORT:-55434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caiofrota -d caiofrota"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
